jobs: 100
keep-going: True
restart-times: 1
rerun-incomplete: True
max-jobs-per-second: 20
max-status-checks-per-second: 100
use-singularity: True
default-resources: [gres="",]
drmaa: "-p {resources.partition} -t {resources.time} -n {resources.threads} --mem={resources.mem_mb} --mem-per-cpu={resources.mem_per_cpu} {resources.gres} -J {rule} -e slurm/{rule}_%j.err -o slurm/{rule}_%j.out --nodes=1-1"
drmaa-log-dir: "slurm"
singularity-args: "--cleanenv --containall -B /beegfs-archive,/beegfs-scratch,/beegfs-storage,/scratch,/projects,/data,$PWD/tmp:/tmp -B $PWD:$PWD -B $HOME -B /usr/lib/locale/:/usr/lib/locale/ --disable-cache --nv"
singularity-prefix: "/projects/wp4/nobackup/singularity_cache/"
