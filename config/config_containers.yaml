# ---------------------------------------------------------------------------
#  Containrar for de regler som poppy (GMS, upstream) sjalv satter i sin config.
#
#  poppy agas av GMS och patchas inte. Dess config.yaml har docker-URI:er; har
#  finns samma regler med containrar fran CGU:s containerbibliotek. Genererad
#  ur poppy v1.0.0 config/config.yaml; kor om vid poppy-uppgradering.
#  Laggs EFTER poppys config.yaml och config_uppsala_*.yaml. Regler som
#  config_uppsala_*.yaml redan satter (bamsnap, bamsnap_downsample_bam) och
#  default_container finns inte har.
# ---------------------------------------------------------------------------

